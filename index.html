@property --h{syntax:"<number>";inherits:true;initial-value:340}
@property --s{syntax:"<percentage>";inherits:true;initial-value:70%}
@property --p1{syntax:"<color>";inherits:true;initial-value:#8b9bd8}
@property --p2{syntax:"<color>";inherits:true;initial-value:#c58bd8}
@property --p3{syntax:"<color>";inherits:true;initial-value:#8bd8c5}
:root{--bg:#eceef6;--ink:#101018;--mute:rgba(50,50,75,.74);--glass:rgba(255,255,255,.55);--g2:rgba(255,255,255,.82);--edge:rgba(255,255,255,.75);--line:rgba(60,60,90,.12);--hv:rgba(60,60,100,.08);--on:#fff;--l:50%;--accent:hsl(var(--h) var(--s) var(--l));--sp:cubic-bezier(.32,.72,0,1);--bn:cubic-bezier(.34,1.56,.64,1);--sh:0 10px 34px rgba(30,30,80,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07070d;--ink:#fff;--mute:rgba(235,235,255,.6);--glass:rgba(38,38,56,.5);--g2:rgba(52,52,74,.86);--edge:rgba(255,255,255,.16);--line:rgba(255,255,255,.1);--hv:rgba(255,255,255,.09);--on:#000;--l:68%;--sh:0 10px 34px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#07070d;--ink:#fff;--mute:rgba(235,235,255,.6);--glass:rgba(38,38,56,.5);--g2:rgba(52,52,74,.86);--edge:rgba(255,255,255,.16);--line:rgba(255,255,255,.1);--hv:rgba(255,255,255,.09);--on:#000;--l:68%;--sh:0 10px 34px rgba(0,0,0,.45)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;min-height:100vh;min-height:100dvh;overflow-x:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{width:1em;height:1em;fill:currentColor;stroke:none;flex:none}
svg.s{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gl{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);border:1px solid var(--edge);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.4)}
#bgc{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bl{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.5;animation:dr 22s ease-in-out infinite alternate}
.b1{top:-25vmax;right:-20vmax;background:var(--p1)}
.b2{bottom:-30vmax;left:-25vmax;background:var(--p2);animation-delay:-9s}
@keyframes dr{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#app{max-width:720px;margin:0 auto;padding:0 18px 200px}
.top{display:flex;align-items:center;gap:10px;padding:22px 0 14px}
h1{flex:1;margin:0;font-size:2rem;font-weight:700}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.25rem;transition:transform .35s var(--bn),color .2s,background .2s;position:relative}
.ib:active{transform:scale(.86)}
.ib.on{color:var(--accent)}
.view{display:none}
.view.on{display:block;animation:vin .6s var(--sp) both}
@keyframes in{from{opacity:0;transform:translateY(26px) scale(.9)}60%{opacity:1;transform:translateY(-3px) scale(1.01)}}
@keyframes vin{from{opacity:0;transform:translateX(var(--dx,0px)) scale(.95)}}
@keyframes hx{from{opacity:0;transform:translateX(calc(var(--dx,0px)*.5))}}
.hx{animation:hx .55s var(--sp) both}
.view.lv{animation:vout .17s ease forwards}
@keyframes vout{to{opacity:0;transform:translateX(calc(var(--dx,0px)*-.7)) scale(.96)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chip{padding:8px 16px;border-radius:999px;white-space:nowrap;font-weight:600;font-size:.88rem;background:var(--glass);border:1px solid var(--edge);transition:background .3s,color .3s,transform .3s var(--bn)}
.chip:active{transform:scale(.92)}
.chip.on{background:transparent;border-color:transparent;color:var(--on)}
.chips{position:relative}
.chip{position:relative;z-index:1}

/* ===== موجة صوتية بسيطة متزامنة مع الموسيقى ===== */
(function(){
  var $=function(i){return document.getElementById(i)},au=$("au");
  var box=$("svis"),an=null,raf=0,last=0,bars=[],data=null;
  if(!box)return;

  for(var i=0;i<28;i++){
    var b=document.createElement("i");
    box.appendChild(b);
    bars.push(b);
  }

  function reset(){
    for(var i=0;i<bars.length;i++)bars[i].style.height="5px";
  }

  function frame(now){
    raf=0;
    if(document.hidden || au.paused){reset();return}
    if(now-last<42){raf=requestAnimationFrame(frame);return}
    last=now;

    an=window.__watarAnalyser||an;
    if(!an){raf=requestAnimationFrame(frame);return}

    if(!data || data.length!==an.frequencyBinCount)
      data=new Uint8Array(an.frequencyBinCount);

    try{an.getByteFrequencyData(data)}catch(e){raf=requestAnimationFrame(frame);return}

    var n=bars.length, step=Math.max(1,Math.floor(data.length/(n+5))),energy=0;
    for(var i=0;i<n;i++){
      var idx=Math.min(data.length-1,2+i*step),v=data[idx]/255;
      // Mirror the wave slightly so the center stays visually balanced.
      var center=Math.abs(i-(n-1)/2)/((n-1)/2);
      v=Math.min(1,v*1.55+(1-center)*.08);
      energy+=v;
      bars[i].style.height=(5+Math.round(v*24))+"px";
      bars[i].style.opacity=(.48+v*.52).toFixed(2);
    }
    box.style.opacity=(.72+Math.min(energy/n,1)*.28).toFixed(2);
    raf=requestAnimationFrame(frame);
  }

  function start(){
    if(!raf)raf=requestAnimationFrame(frame);
  }
  function stop(){
    if(raf){cancelAnimationFrame(raf);raf=0}
    reset();
    box.style.opacity=".72";
  }

  au.addEventListener("play",start);
  au.addEventListener("pause",stop);
  au.addEventListener("ended",stop);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden)stop();
    else if(!au.paused)start();
  });
})();
